name: Publish Docker images

on:
  release:
    types: [published]

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versions.txt
        id: versions
        run: echo "versions=$(grep -Ev '^[[:space:]]*(#|$)' versions.txt | awk '{ print $1 }' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build_and_pub:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trik-studio-version: ${{ fromJson(needs.versions.outputs.versions) }}
    env:
      USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/trik-studio:${{ matrix.trik-studio-version }}-${{ github.ref_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image for TRIK Studio ${{ matrix.trik-studio-version }}
        run: ./build.sh --trik-studio-version "${{ matrix.trik-studio-version }}" --docker-hub-user "$USERNAME" --scripts-version "${{ github.ref_name }}" --verbose

      - name: Run tests
        run: ./run_tests.sh

      - name: Push image to docker.io
        run: docker push "$IMAGE"
