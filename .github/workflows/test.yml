name: "Build docker from master, run tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docker from master
        run: ./build.sh --trik-studio-version-kind master --docker-hub-user username --verbose

      - name: Run master tests
        run: IMAGE="$(docker images --filter 'reference=username/trik-studio:master-*' --format '{{.Repository}}:{{.Tag}}' | head -n 1)" ./run_tests.sh

      - name: Build docker from release
        run: ./build.sh --trik-studio-version-kind release --docker-hub-user username --verbose

      - name: Run release tests
        run: IMAGE="$(docker images --filter 'reference=username/trik-studio:release-*' --format '{{.Repository}}:{{.Tag}}' | head -n 1)" ./run_tests.sh